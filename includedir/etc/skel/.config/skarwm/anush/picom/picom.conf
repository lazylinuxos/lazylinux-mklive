#################################
#             Shadows           #
#################################

shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#           Fading              #
#################################

fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1.0;

#################################
#           Corners             #
#################################

corner-radius = 0;

#################################
#     Background-Blurring       #
#################################

blur-kern = "3x3box";

#################################
#      Window Animations        #
#################################

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    # A small scale change is easier to render and does not make large
    # windows look as if they jump from an edge of the screen.
    scale = 0.98;
    duration = 0.14;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    scale = 0.98;
    duration = 0.12;
  }
);

# Do not add a global "geometry-change" animation here. skarwm keeps inactive
# workspaces, hidden tabs, and scratchpads mapped at x=-20000. Animating their
# position makes them visibly fly in from the left when they become active.
# Picom also documents geometry-change as experimental; it can stutter during
# tiled reflows and while interactively moving or resizing windows.

#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On NVIDIA proprietary drivers it can cause mouse/render lag and
# broken vsync — if you see that, switch to "glx".
backend = "xrender";
dithered-present = false;
vsync = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#         Window Rules          #
#################################

rules: ({
  # No shadows on notifications and GTK frame windows
  match = "name = 'Notification'   || "
          "class_g ?= 'Notify-osd' || "
          "window_type = 'dock'    || "
          "window_type = 'dnd'     || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # No blur on dock, desktop, and GTK frame
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  # No rounded corners on dock and desktop
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # Transient UI: paint directly at its final position. Some toolkits expose
  # menus as utility or override-redirect windows instead of popup_menu.
  match = "override_redirect              || "
          "window_type = 'popup_menu'     || "
          "window_type = 'dropdown_menu'  || "
          "window_type = 'tooltip'        || "
          "window_type = 'utility'        || "
          "window_type = 'notification'   || "
          "window_type = 'dock'           || "
          "window_type = 'desktop'        || "
          "window_type = 'dialog'";
  fade = false;
  animations = false;
}, {
  # Menus and tooltips: slight transparency
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'tooltip'";
  opacity = 0.95;
}, {
  # Tooltip shadow
  match = "window_type = 'tooltip'";
  shadow = true;
  full-shadow = false;
}, {
  # Dim unfocused windows
  match = "!focused";
  opacity = 0.95;
}, {
  # Geany opacity (overrides unfocused dimming)
  match = "class_g = 'Geany'";
  opacity = 0.95;
})
